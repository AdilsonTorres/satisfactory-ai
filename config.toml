# config.toml — Central configuration for the Satisfactory Bot
# Adjust here without touching Python code.

[temporal]
address    = "localhost:7233"
task_queue = "satisfactory-bot"

# ---------------------------------------------------------------------------
# Vision
# ---------------------------------------------------------------------------
[vision]
monitor_index     = 1      # 1 = primary monitor
default_threshold = 0.82

# Per-template thresholds. Static menus: 0.85+. Moving enemies: 0.65–0.72.
[vision.thresholds]
gift_prompt               = 0.75   # live 2026-06-30: the "Press E…has found anything" prompt scores ~0.79 present vs ~0.20 absent — 0.82 was rejecting real prompts
inventory_open            = 0.82
doggo_loot_window         = 0.82
inventory_full_indicator  = 0.75
health_low_indicator      = 0.78
equipment_workshop_prompt = 0.85
workshop_menu_open        = 0.85
rifle_ammo_icon           = 0.85
craft_button              = 0.87
death_screen              = 0.60   # captured live 2026-06-25 from an actual in-game death; real matches score 0.75-1.0, normal gameplay ~0.25 (was 0.90 as an untested placeholder, with no template file at all)
enemy_remains_prompt      = 0.78
enemy_spitter             = 0.70
enemy_hog                 = 0.70
enemy_stinger             = 0.68
enemy_spitter_elite       = 0.70
enemy_hatcher             = 0.72
enemy_flying_crab         = 0.65
enemy_hog_nuclear         = 0.70
enemy_stinger_elite_gas   = 0.68
resource_node_prompt      = 0.80
wild_doggo_prompt         = 0.72   # creature — variable like the enemies
doggo_body                = 0.62   # tamed Doggo silhouette — used to aim the camera at it
paleberry_icon            = 0.85   # static UI icon
storage_prompt            = 0.82
storage_open              = 0.85
pause_menu                = 0.55   # 'Resume/Save/Load Game' text block. Live 2026-07-01: pause menu ~1.0, gameplay ~0.18 — 0.55 leaves a wide margin while tolerating the dimmed scene behind it changing

# ---------------------------------------------------------------------------
# Fixed screen regions for menu templates that always render at the same
# place. When a template has an entry here, the verified open/close helpers
# (activities/_shared.py) match it with the fast cropped grab (~0.2s) instead
# of a full-frame capture (~5s) — this makes press_until_closed drop from ~10s
# to <1s for these menus. Calibrated live 2026-07-01 at 2560x1440: each region
# is the template's on-screen bounding box + a 25px margin. RE-CALIBRATE if the
# UI scale or resolution changes (a wrong region silently breaks detection).
# Regenerate with the match-location of each template on a full frame with the
# menu open (see scratchpad/calibrate_regions.py).
# ---------------------------------------------------------------------------
[vision.regions.inventory_open]
x = 1575
y = 167
w = 428
h = 780

[vision.regions.doggo_loot_window]
x = 905
y = 905
w = 270
h = 105

[vision.regions.pause_menu]
x = 25
y = 160
w = 410
h = 275

# ---------------------------------------------------------------------------
# Manual resource harvesting (player already positioned at the node)
# ---------------------------------------------------------------------------
[harvesting]
swing_interval_seconds = 0.5

# ---------------------------------------------------------------------------
# Lizard Doggo taming
# Screen coordinates where the Paleberry dragged from the inventory is
# dropped (a point outside the inventory panel, in the game world).
# ---------------------------------------------------------------------------
[taming]
drop_point_x = 1280
drop_point_y = 720

# Camera sweep used by _face_doggo_and_recheck when the gift prompt isn't
# already visible: it walks several downward PITCH rows (Doggos are ground
# creatures, so a yaw-only sweep at the horizon misses them) and steps yaw
# across each row, watching for the 'gift_prompt' UI band. search_pitch_rows
# are relative pitch deltas applied in sequence (positive = look down).
search_yaw_step = 180
search_yaw_count = 8
search_pitch_rows = [0, 160, 160]

# Screen coords of the Doggo's single Inventory slot in its name/management
# dialog (opened by interacting with a tamed Doggo) — shift-clicked by
# collect_doggo_gift to pull a found item into the player's inventory.
# CALIBRATE with debug_run.py --screenshot while the dialog is open.
doggo_loot_slot_x = 995
doggo_loot_slot_y = 1045

# ---------------------------------------------------------------------------
# Player inventory grid, used by check_inventory_full (slot-scan) and
# open_storage_and_deposit_loot (shift-click sweep). CALIBRATE with a
# screenshot of the open inventory: origin = top-left corner of the first
# slot, slot_w/slot_h = spacing between slots in pixels.
# Calibrated 2026-06-29 from live 2560x1440 screenshot:
#   - Panel starts at x=568, panel header is ~32px tall
#   - Slots begin at y=170 (past the panel header)
#   - 10 columns × 6 rows, each slot 32×32px
# ---------------------------------------------------------------------------
[inventory_grid]
origin_x = 568
origin_y = 330
slot_w   = 32
slot_h   = 32
columns  = 10
rows     = 5

# ---------------------------------------------------------------------------
# Inventory sort button — clicked by check_inventory_full when all slots
# appear occupied, to merge partial stacks before re-checking.
# The '≡ Sort' button is at the bottom-centre of the Inventory panel.
# Calibrated 2026-06-29 from live screenshot at 2560x1440.
# ---------------------------------------------------------------------------
[inventory_sort_button]
x = 630
y = 575

# ---------------------------------------------------------------------------
# Inventory full detection thresholds
# empty_slot_brightness: BGR median below this value = slot is empty.
# At 2560x1440: empty inventory slots read ~57-63 BGR median brightness.
# Filled slots (item icons) read >85. Threshold of 80 gives a clear margin.
# low_guard (hardcoded to 50 in activities/inventory.py): panel chrome
# (borders, headers) reads <50 and is excluded from the empty-slot check.
# Recalibrate if you change the UI scale or resolution.
# ---------------------------------------------------------------------------
[inventory]
empty_slot_brightness = 80

# ---------------------------------------------------------------------------
# Navigation (seconds of key held down)
# THESE ARE THE MOST IMPORTANT VALUES TO CALIBRATE.
# Adjust until the character arrives in front of the Workshop.
# ---------------------------------------------------------------------------
[navigation]
to_workshop_forward_1    = 1.2
to_workshop_strafe_right = 0.8
to_workshop_forward_2    = 0.5
back_to_base_backward_1  = 1.2
back_to_base_strafe_left = 0.8
back_to_base_backward_2  = 0.5

# ---------------------------------------------------------------------------
# Named locations — used by navigate_to_location (CombatExpeditionWorkflow
# and other future automations). Generalizes the fixed Workshop navigation:
# define as many locations as you want, each with its own key/duration
# sequence. Each step runs inp.hold(key, duration) in order.
#
# arrival_template (optional): name of a template that confirms arrival via
# vision. Without it, navigation is "blind" — it only trusts key timing,
# like the original navigate_to_equipment_workshop.
#
# IMPORTANT: calibrate 'example_kill_zone' and 'base' with the real timings
# of your map before using CombatExpeditionWorkflow. Duplicate the block to
# add more locations (ex: locations.spitter_nest, locations.storage_room).
# ---------------------------------------------------------------------------
[locations.example_kill_zone]
arrival_timeout = 5.0
# arrival_template = "enemy_spitter"   # optional

[[locations.example_kill_zone.steps]]
key = "w"
duration = 3.0

[locations.base]
arrival_timeout = 5.0
# arrival_template = "workshop_menu_open"   # optional

[[locations.base.steps]]
key = "s"
duration = 3.0

# ---------------------------------------------------------------------------
# Exploration (blind, screenshot-driven traversal around the base)
# Each [[exploration.route]] leg holds `keys` simultaneously for `duration`
# seconds, after first turning the camera by `turn_dx` (mouse-x delta,
# 0 = no turn). Including "space" in `keys` holds jump — this drives Hover
# Pack ascend/glide if it's equipped and there's nearby powered
# infrastructure to recharge from (the existing pole grid around your
# factory); if not equipped, it's a harmless repeated hop, so the route is
# safe to run either way.
#
# ExplorationWorkflow stops early if accumulated leg duration would exceed
# max_total_duration_seconds, or if health_low_indicator is detected, then
# automatically retraces the legs already taken in reverse (mirrored keys,
# mirrored turns) to return toward the start — the same blind-navigation
# idiom as [navigation]. This is exploratory and unsupervised: keep legs
# short and the total duration conservative, and use `stop` (Temporal
# signal) to interrupt at any time.
# ---------------------------------------------------------------------------
[exploration]
max_total_duration_seconds = 25.0
screenshot_every_leg       = true

# Health is read from the bottom-left HUD bar (10 lit segments at full health,
# depletes right-to-left), via Vision.assess(). A leg aborts the outbound
# route when the health fraction drops to or below this. 0.4 = 4/10 segments.
health_low_frac = 0.4

# Hover Pack charge-ring fill is logged per chunk for death analysis (gauge
# distance vs health). Calibrated live on 2026-06-25: the ring geometry is
# hardcoded in utils/vision.py (_GAUGE_CENTER/_GAUGE_RADIUS, 2560x1440) and read
# by Vision._read_gauge_fraction(), which returns the white-ring fill while
# flying (the spinning fan icon) and None when grounded (objective checkmark).

# Each leg now runs in check_interval_seconds-sized chunks instead of one
# long blind hold, checking health/death AND saving a screenshot after
# every chunk (not just once per leg) — added after a live death during
# an uninterrupted 3.5s hold on 2026-06-25 where the cause couldn't be
# pinned down: there was no checkpoint inside the window where it happened.
check_interval_seconds = 1.0

# If >0, taps space for ascend_pulse_seconds every N chunks (independent
# of whether "space" is already in a leg's own keys) to counter altitude
# loss during sustained flight — use this to "stay as high as possible
# without losing the Hover Pack's charge range" rather than relying on
# legs that hold space continuously.
ascend_every_chunks  = 0
ascend_pulse_seconds = 0.3

[[exploration.route]]
keys = ["w"]
duration = 2.0
turn_dx = 700

[[exploration.route]]
keys = ["w", "space"]
duration = 1.5
turn_dx = 0

[[exploration.route]]
keys = ["w"]
duration = 2.0
turn_dx = 300

[[exploration.route]]
keys = ["w", "space"]
duration = 1.5
turn_dx = -300

[[exploration.route]]
keys = ["w"]
duration = 2.0
turn_dx = -300

# ---------------------------------------------------------------------------
# Combat
# ---------------------------------------------------------------------------
[combat]
aim_sensitivity_factor      = 0.8    # 1.0 turns a lot, 0.5 turns little
shoot_bursts                = 5      # clicks per round
shoot_interval_seconds      = 0.08   # seconds between clicks
max_combat_duration_seconds = 10.0   # give up on combat after X seconds
dodge_direction             = "a"    # dodge direction when fleeing
low_ammo_threshold          = 20     # below this, CombatExpeditionWorkflow will resupply

# Screen region where the ammo counter appears in the HUD (weapon corner).
# CALIBRATE with debug_run.py --screenshot + an image editor to find
# x,y,w,h in pixels. If reading fails, check_ammo_count returns -1 and the
# workflow ignores ammo gating (treats it as "unknown", doesn't block).
[combat.ammo_region]
x = 2360
y = 1320
w = 100
h = 40

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
[display]
# CALIBRATED 2026-06-25 via debug_run.py --screenshot: the actual capture
# resolution is 2560x1440 (mss grabs the monitor's native resolution),
# not 1920x1080. This matters because aim_at_screen_position/
# _face_doggo_and_recheck use screen_width/height to compute the camera
# center — a mismatch here skews every aim/turn calculation, including
# combat. Recalibrate if you change display/game resolution.
screen_width  = 2560
screen_height = 1440

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[logging]
level = "INFO"   # DEBUG | INFO | WARNING | ERROR
