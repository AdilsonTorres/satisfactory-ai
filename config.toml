# config.toml — Central configuration for the Satisfactory Bot
# Adjust here without touching Python code.

[temporal]
address    = "localhost:7233"
task_queue = "satisfactory-bot"

# ---------------------------------------------------------------------------
# Vision
# ---------------------------------------------------------------------------
[vision]
monitor_index     = 1      # 1 = primary monitor
default_threshold = 0.82

# Per-template thresholds. Static menus: 0.85+. Moving enemies: 0.65–0.72.
[vision.thresholds]
gift_prompt               = 0.82
inventory_open            = 0.82
doggo_loot_window         = 0.82
inventory_full_indicator  = 0.75
health_low_indicator      = 0.78
equipment_workshop_prompt = 0.85
workshop_menu_open        = 0.85
rifle_ammo_icon           = 0.85
craft_button              = 0.87
death_screen              = 0.90
respawn_button            = 0.85
enemy_remains_prompt      = 0.78
enemy_spitter             = 0.70
enemy_hog                 = 0.70
enemy_stinger             = 0.68
enemy_spitter_elite       = 0.70
enemy_hatcher             = 0.72
enemy_flying_crab         = 0.65
enemy_hog_nuclear         = 0.70
enemy_stinger_elite_gas   = 0.68
resource_node_prompt      = 0.80
wild_doggo_prompt         = 0.72   # creature — variable like the enemies
paleberry_icon            = 0.85   # static UI icon
storage_prompt            = 0.82
storage_open              = 0.85

# ---------------------------------------------------------------------------
# Manual resource harvesting (player already positioned at the node)
# ---------------------------------------------------------------------------
[harvesting]
swing_interval_seconds = 0.5

# ---------------------------------------------------------------------------
# Lizard Doggo taming
# Screen coordinates where the Paleberry dragged from the inventory is
# dropped (a point outside the inventory panel, in the game world).
# ---------------------------------------------------------------------------
[taming]
drop_point_x = 1280
drop_point_y = 720

# ---------------------------------------------------------------------------
# Player inventory grid, used by open_storage_and_deposit_loot to sweep
# every slot with shift-click (shift-clicking an empty slot does nothing,
# so there's no need to detect items one by one). CALIBRATE with a
# screenshot of the open inventory: origin = top-left corner of the first
# slot, slot_w/slot_h = spacing between slots in pixels.
# ---------------------------------------------------------------------------
[inventory_grid]
origin_x = 100
origin_y = 100
slot_w   = 90
slot_h   = 90
columns  = 10
rows     = 4

# ---------------------------------------------------------------------------
# Navigation (seconds of key held down)
# THESE ARE THE MOST IMPORTANT VALUES TO CALIBRATE.
# Adjust until the character arrives in front of the Workshop.
# ---------------------------------------------------------------------------
[navigation]
to_workshop_forward_1    = 1.2
to_workshop_strafe_right = 0.8
to_workshop_forward_2    = 0.5
back_to_base_backward_1  = 1.2
back_to_base_strafe_left = 0.8
back_to_base_backward_2  = 0.5

# ---------------------------------------------------------------------------
# Named locations — used by navigate_to_location (CombatExpeditionWorkflow
# and other future automations). Generalizes the fixed Workshop navigation:
# define as many locations as you want, each with its own key/duration
# sequence. Each step runs inp.hold(key, duration) in order.
#
# arrival_template (optional): name of a template that confirms arrival via
# vision. Without it, navigation is "blind" — it only trusts key timing,
# like the original navigate_to_equipment_workshop.
#
# IMPORTANT: calibrate 'example_kill_zone' and 'base' with the real timings
# of your map before using CombatExpeditionWorkflow. Duplicate the block to
# add more locations (ex: locations.spitter_nest, locations.storage_room).
# ---------------------------------------------------------------------------
[locations.example_kill_zone]
arrival_timeout = 5.0
# arrival_template = "enemy_spitter"   # optional

[[locations.example_kill_zone.steps]]
key = "w"
duration = 3.0

[locations.base]
arrival_timeout = 5.0
# arrival_template = "workshop_menu_open"   # optional

[[locations.base.steps]]
key = "s"
duration = 3.0

# ---------------------------------------------------------------------------
# Combat
# ---------------------------------------------------------------------------
[combat]
aim_sensitivity_factor      = 0.8    # 1.0 turns a lot, 0.5 turns little
shoot_bursts                = 5      # clicks per round
shoot_interval_seconds      = 0.08   # seconds between clicks
max_combat_duration_seconds = 10.0   # give up on combat after X seconds
dodge_direction             = "a"    # dodge direction when fleeing
low_ammo_threshold          = 20     # below this, CombatExpeditionWorkflow will resupply

# Screen region where the ammo counter appears in the HUD (weapon corner).
# CALIBRATE with debug_run.py --screenshot + an image editor to find
# x,y,w,h in pixels. If reading fails, check_ammo_count returns -1 and the
# workflow ignores ammo gating (treats it as "unknown", doesn't block).
[combat.ammo_region]
x = 2360
y = 1320
w = 100
h = 40

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
[display]
screen_width  = 1920
screen_height = 1080

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[logging]
level = "INFO"   # DEBUG | INFO | WARNING | ERROR
