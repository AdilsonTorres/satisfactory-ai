# docker-compose.yml — Orchestrator worker only.
#
# The private Temporal cluster (postgresql, temporal, temporal-ui) has been
# retired: satisfactory-ai now uses the shared personal cluster on my-scorpion
# (172.28.125.187:7233), namespace "satisfactory-ai".
#
# The "worker" service below is the ORCHESTRATOR worker (workflows +
# persistence activities). It runs 24/7 regardless of the host desktop
# session. It connects to the external cluster via the host network.
#
# The HOST game-input worker (screen capture / keyboard / mouse) is NOT in
# this compose: run it manually on the desktop session:
#   uv run python workers/worker.py
# (or install the systemd user service — see docs/deploy.md)
#
# Backup (old private cluster): docker-compose.yml.bak-20260729

services:
  worker:
    mem_limit: 512m
    build: .
    container_name: satisfactory-worker
    restart: unless-stopped
    # Run as the host user so files created on the ./stats bind mount
    # (SQLite gift history) stay writable from the host.
    user: "1000:1000"
    network_mode: host        # needs to reach 172.28.125.187:7233 over ZeroTier
    environment:
      TEMPORAL_ADDRESS: "172.28.125.187:7233"
      TEMPORAL_NAMESPACE: "satisfactory-ai"
      HOME: /tmp
    volumes:
      # SQLite gift history + session stats land on the host
      - ./stats:/app/stats
      - ./workflows:/app/workflows
      - ./config.toml:/app/config.toml
