[project]
name = "satisfactory-ai"
version = "0.3.0"
description = "Satisfactory AFK bot orchestrated via Temporal"
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.30.0",
    "mss>=10.2.0",
    "opencv-python>=5.0.0",
    "numpy>=2.5.0",
    "pynput>=1.8.2",
    "pytesseract>=0.3.13",
    "evdev>=1.9.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["activities", "workflows", "workers", "utils", "tools"]

[project.scripts]
sbot = "tools.cli:main"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["activities", "workflows", "workers", "utils", "tools"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
