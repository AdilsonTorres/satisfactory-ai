[project]
name = "satisfactory-ai"
version = "0.2.0"
description = "Satisfactory AFK bot orchestrated via Temporal"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7.0",
    "mss>=9.0.1",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pynput>=1.7.6",
    "pytesseract>=0.3.10",
    "evdev>=1.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["activities", "workflows", "workers", "utils"]
